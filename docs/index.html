<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Replace Acro TD Hotkey Manager (twice) and acro-td-hotkey-manager. Everything else comes from acro-docs-theme. -->
    <title>Acro TD Hotkey Manager · Documentation</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/acronym-lol/acro-docs-theme@1/theme/acro-docsify.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: 'Acro TD Hotkey Manager',
        repo: 'https://github.com/acronym-lol/acro-td-hotkey-manager',
      };
    </script>
    <!-- Plain scripts after #app, not async or defer: the theme loads Docsify at the
           versions it pins, and Docsify needs the page body to exist when it starts. -->
    <script src="https://cdn.jsdelivr.net/gh/acronym-lol/acro-docs-theme@1/theme/acro-docsify.js"></script>
  </body>
</html>
